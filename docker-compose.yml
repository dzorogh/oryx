# Deployed on Dokploy as a Compose service.
# Domains are attached per-service through Dokploy (Traefik handles TLS + the
# WebSocket upgrade), so no host ports are published here.
#
# Builds must stay sequential on the shared host: Dokploy command builds `web`
# then `collab` (see docs/deploy/dokploy.md). Runtime caps keep a runaway Node
# process from starving every other app on the box.
services:
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_COLLAB_WS_URL: ${NEXT_PUBLIC_COLLAB_WS_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    expose:
      - "3000"
    mem_limit: 768m
    cpus: 1.0
    networks:
      - dokploy-network

  collab:
    build:
      context: .
      target: collab
    restart: unless-stopped
    expose:
      - "1234"
    mem_limit: 256m
    cpus: 0.5
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
