<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Reservation — owner source → target</title>
    <style>
      body { font: 14px/1.45 system-ui, sans-serif; background: #f4f4f5; color: #18181b; margin: 0; padding: 32px; }
      .dialog { width: 560px; margin: 0 auto; background: #fff; border: 1px solid #e4e4e7; border-radius: 12px; padding: 20px; }
      h1 { font-size: 18px; margin: 0 0 16px; }
      label { display: block; font-size: 12px; color: #71717a; margin-bottom: 4px; }
      .field { margin-bottom: 12px; }
      select, input { width: 100%; border: 1px solid #d4d4d8; border-radius: 8px; padding: 8px; }
      .row { border: 1px solid #e4e4e7; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
      .chip { display: inline-block; background: #f4f4f5; border-radius: 999px; padding: 2px 8px; font-size: 12px; }
      .actions { display: flex; gap: 8px; margin-top: 16px; }
      button { border-radius: 8px; padding: 8px 12px; border: 1px solid #d4d4d8; background: #fff; }
      button.primary { background: #18181b; color: #fff; border-color: #18181b; }
    </style>
  </head>
  <body>
    <div class="dialog">
      <h1>New reservation</h1>
      <p><span class="chip">Reassign</span> derived from destination + sources</p>
      <div class="field">
        <label>Destination</label>
        <select><option>Order · OMS-12</option></select>
      </div>
      <div class="field">
        <label>Place</label>
        <select><option>Warehouse · WH-1</option></select>
      </div>
      <div class="row">
        <div class="field"><label>Product</label><select><option>PRD-4 Pump</option></select></div>
        <div class="field"><label>Source</label><select><option>Regional reserve · REG-3 · 6 available</option></select></div>
        <div class="field"><label>Quantity</label><input value="2" /></div>
      </div>
      <div class="row">
        <div class="field"><label>Product</label><select><option>PRD-4 Pump</option></select></div>
        <div class="field"><label>Source</label><select><option>Free · 3 available</option></select></div>
        <div class="field"><label>Quantity</label><input value="1" /></div>
      </div>
      <div class="actions">
        <button>Save draft</button>
        <button class="primary">Post</button>
      </div>
    </div>
  </body>
</html>
