<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oryx · Документы магазина — макет редизайна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f6;--card:#fff;--fg:#18181b;--fg2:#3f3f46;--muted:#71717a;--faint:#a1a1aa;
  --line:#e6e6e9;--line2:#f0f0f2;--soft:#f8f8f9;--hover:#fafafa;
  --primary:#18181b;--nav:#141b33;--lime:#c9f56a;
  --blue:#2563eb;--bluebg:#eff4ff;--green:#15803d;--greenbg:#effaf2;--amber:#b45309;--amberbg:#fff7ea;--red:#b91c1c;--redbg:#fef2f2;
  --r:12px;--shadow:0 1px 2px rgb(16 24 40 / .04),0 1px 3px rgb(16 24 40 / .03);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9eaee;color:var(--fg);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}

/* switcher */
.switcher{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 20px;background:rgb(233 234 238 / .85);backdrop-filter:blur(8px);border-bottom:1px solid #dcdde2}
.switcher b{font-size:12px;color:var(--muted);font-weight:600;margin-right:6px}
.switcher button{border:1px solid #d6d7dc;background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--fg2)}
.switcher button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.notes{width:min(1440px,calc(100vw - 40px));margin:14px auto 0;background:#fff;border:1px solid #dcdde2;border-radius:12px;padding:12px 16px;font-size:13px;color:var(--fg2)}
.notes h3{margin:0 0 6px;font-size:13px}
.notes ul{margin:0;padding-left:18px}.notes li{margin:2px 0}

/* frame */
.frame{width:min(1440px,calc(100vw - 40px));margin:14px auto 40px;border:1px solid #d7d9df;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgb(17 24 39 / .08);background:var(--bg)}
.app{display:grid;grid-template-columns:48px 212px minmax(0,1fr);min-height:900px}
.rail{background:var(--nav);display:flex;flex-direction:column;align-items:center;gap:18px;padding:12px 0}
.rail .logo{width:26px;height:26px;border-radius:7px;background:var(--lime);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--nav)}
.rail .ic{width:18px;height:18px;border:1.6px solid #9aa3bd;border-radius:5px;opacity:.8}
.rail .ic.on{border-color:var(--lime)}

/* grouped sidebar */
.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.side .mod{display:flex;justify-content:space-between;align-items:center;padding:0 8px 2px;font-weight:650;font-size:14.5px}
.side .grp{display:flex;flex-direction:column;gap:1px}
.side .grp-t{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:0 9px 5px}
.side a{display:flex;align-items:center;gap:9px;padding:6.5px 9px;border-radius:8px;font-size:13px;color:#52525b}
.side a:hover{background:var(--soft)}
.side a.on{background:#f1f1f3;color:var(--fg);font-weight:600}
.side a svg{width:15px;height:15px;flex:none;color:#a1a1aa}
.side a.on svg{color:var(--fg)}
.side .spacer{flex:1}

/* main */
.main{min-width:0;padding:14px 22px 36px}
.crumbs{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.crumbs b{color:var(--fg);font-weight:600}
.crumbs i{font-style:normal;color:#c4c4ca}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* document header */
.dh{padding:18px 20px 0}
.dh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
.eyebrow svg{width:14px;height:14px}
.dh-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh h1{margin:0;font-size:26px;line-height:1.15;font-weight:650;letter-spacing:-.02em}
.dh-desc{margin:5px 0 0;color:var(--muted);font-size:13px}
.dh-actions{display:flex;gap:8px;align-items:center;flex:none}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:16px -20px 0;border-top:1px solid var(--line2)}
/* tabs */
.tabs{display:flex;gap:2px;margin:18px 0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{position:relative;display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:9px 12px 11px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected=true]{color:var(--fg);font-weight:600}
.tabs button[aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--fg)}
.tabs .tc{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted);background:#ececef;border-radius:999px;padding:0 7px;line-height:18px}
.tabs button[aria-selected=true] .tc{background:var(--fg);color:#fff}
.panel[hidden]{display:none}
.meta>div{padding:11px 20px 13px;border-left:1px solid var(--line2);min-width:0}
.meta>div:first-child{border-left:0}
.meta dt{font-size:11.5px;color:var(--muted);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta dd{margin:0;font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:6px;height:32px;white-space:nowrap;overflow:hidden}
.meta dd .code{height:24px;padding:0 8px;font-size:12px}
.meta dd .pill{height:24px}
.meta .ent{flex-direction:row;align-items:center;gap:6px}
.meta .ent span{font-size:13.5px;color:var(--fg);font-weight:550}
.p-warn{background:var(--amberbg);color:var(--amber);border-color:#fbe3bf}
.meta dd small{font-weight:400;color:var(--muted);font-size:12px}

.meta .wide{grid-column:span 2}
.edit{display:inline-flex;align-items:center;gap:7px;height:32px;margin-left:-8px;padding:0 8px;border:1px solid transparent;border-radius:8px;font-weight:550;cursor:pointer}
.edit:hover,.sel:hover{background:var(--soft);border-color:var(--line)}
.edit svg{width:12px;height:12px;color:var(--faint)}
.sel{display:inline-flex;align-items:center;gap:6px;height:32px;margin-left:-8px;padding:0 6px 0 8px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.sel svg{width:12px;height:12px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:550;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:#27272a}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.sm.icon{width:28px}
.btn svg{width:14px;height:14px}

/* pills & codes */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:550;border:1px solid transparent;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-draft{background:#f4f4f5;color:#52525b;border-color:#e4e4e7}
.p-work{background:var(--bluebg);color:var(--blue);border-color:#dbe6fe}
.p-done{background:var(--greenbg);color:var(--green);border-color:#d3f0dc}
.p-cancel{background:var(--redbg);color:var(--red);border-color:#fbdcdc}
.p-neutral{background:#fff;color:var(--fg2);border-color:var(--line)}
.code{display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1px solid var(--line);border-radius:6px;background:#fff;font:500 11px/1 ui-monospace,"SF Mono",Menlo,monospace;color:#52525b;letter-spacing:.01em;white-space:nowrap}
a.code:hover{border-color:#c9c9cf;color:var(--fg)}

/* journey (customer order) — separate card under the header */
.jcard{margin-top:12px;overflow:hidden}
.journey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.jcard .related{margin:0;border-radius:0}
.rel-panel{display:none;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line2)}
.jcard.open .rel-panel{display:grid}
.jcard.open .related .push svg{transform:rotate(180deg)}
.related .push svg{width:14px;height:14px;transition:transform .15s}
.related .push{border:0;background:transparent;font-size:12.5px;padding:4px 6px;border-radius:6px}
.related .push:hover{background:#ececef}
.stage{padding:14px 16px 16px 20px;border-left:1px solid var(--line2);position:relative;min-width:0}
.stage:first-child{border-left:0}
.st-h{display:flex;align-items:center;gap:9px}
.st-dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid #d4d4d8;color:#fff;font-size:10px;font-weight:700}
.st-dot.done{background:var(--green);border-color:var(--green)}
.st-dot.cur{border-color:var(--blue);background:radial-gradient(circle,var(--blue) 0 4px,#fff 4.5px)}
.st-dot svg{width:11px;height:11px}
.st-t{font-weight:600;font-size:13.5px}
.st-c{font-size:12px;color:var(--muted)}
.st-h .btn{margin-left:auto}
.st-docs{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.st-doc{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"code pill" "cap cap";align-items:center;gap:4px 8px;padding:7px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--soft);font-size:12px}
.st-doc .code{grid-area:code}.st-doc .pill{grid-area:pill;justify-self:end}
.st-doc .grow{grid-area:cap;color:var(--muted)}
.st-empty{margin-top:10px;font-size:12px;color:var(--faint)}
.related{border-top:1px solid var(--line2);padding:8px 14px 8px 20px;display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted);background:var(--soft)}
.related b{color:var(--fg2);font-weight:600}
.related .chipset{display:flex;gap:6px;align-items:center}
.related .push{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--fg2);cursor:pointer}
.dh-foot{height:0}

/* route (transfer) */
.route{display:flex;align-items:center;gap:10px}
.route .node{display:flex;flex-direction:column;gap:3px}
.route .node small{font-size:11px;color:var(--muted);font-weight:400}
.route .arrow{color:#c4c4ca;font-size:16px}
.route .now{padding:4px 10px;border-radius:8px;background:var(--greenbg);border:1px solid #d3f0dc}

/* sections */
.canvas{display:flex;flex-direction:column;gap:16px;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sec{overflow:hidden;scroll-margin-top:70px}
.sec-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.sec-h h2{margin:0;font-size:14.5px;font-weight:620;letter-spacing:-.005em}
.sec-h .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;background:#f4f4f5;border-radius:999px;padding:1px 7px}
.sec-h .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.sec-f{padding:10px 16px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.pager{display:flex;gap:4px}
.pager span{min-width:28px;height:28px;display:grid;place-items:center;border-radius:7px;border:1px solid transparent;font-variant-numeric:tabular-nums}
.pager span.on{border-color:var(--line);color:var(--fg);background:#fff}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2)}
.toggle i{width:30px;height:18px;border-radius:999px;background:var(--primary);position:relative}
.toggle i::after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{font-size:11.5px;font-weight:550;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
th:first-child,td:first-child{padding-left:16px}
th:last-child,td:last-child{padding-right:16px}
.n{text-align:right}
.c{text-align:center}
.zero{color:#c4c4ca}
.strong{font-weight:650}
.prod{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.prod a{font-weight:550;color:var(--fg)}
.prod a:hover{text-decoration:underline;text-underline-offset:2px}
.ent{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.ent span{font-size:12.5px;color:var(--fg2)}
.delta{font-weight:650;font-variant-numeric:tabular-nums}
.delta.plus{color:var(--green)}
.delta.minus{color:var(--fg2)}
.time{color:var(--muted);white-space:nowrap}
.muted{color:var(--muted)}
.row-act{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.disc{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.disc:hover{background:#f1f1f3}
.disc svg{width:14px;height:14px;transition:transform .15s}
.disc[aria-expanded=true] svg{transform:rotate(90deg)}
.pline{display:flex;align-items:center;gap:8px}

/* grouped header (customer order lines) */
.lines th.g{text-align:center;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:0;padding:10px 12px 0}
.lines .sticky{position:sticky;left:0;z-index:2;background:#fff}
.lines tbody tr:hover .sticky{background:var(--hover)}
.lines .book{background:#fcfcfc}
.lines tbody tr:hover .book{background:#f7f7f8}
.lines th.book{background:#fcfcfc}
.lines .sep{border-left:1px solid var(--line2)}
.ship{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ship .bar{width:64px;height:4px;border-radius:999px;background:#ececef;overflow:hidden}
.ship .bar i{display:block;height:100%;background:var(--fg2);border-radius:999px}
.ship.ok{color:var(--green)}
.ship.ok .bar i{background:var(--green)}
.okmark{display:inline-flex;align-items:center;gap:4px}
.okmark svg{width:13px;height:13px}

/* production order breakdown rows (previous layout) */
tr.brk td{background:var(--soft)!important;padding-top:7px;padding-bottom:7px;font-size:12.5px}
tr.brk .ent span{font-size:12.5px}
tr.details>td{padding:0;background:var(--soft)!important;border-bottom:1px solid var(--line2)}
.rlist{width:100%;border-collapse:collapse;font-size:12.5px}
.rlist caption{text-align:left;padding:8px 16px 2px 46px;color:var(--muted);font-size:11px}
.rlist th,.rlist td{padding:6px 16px;border:0;background:transparent!important}
.rlist th{font-size:11px;color:var(--muted);font-weight:500}
.rlist th:first-child,.rlist td:first-child{padding-left:46px}
.rlist tr:last-child td{padding-bottom:10px}

/* transfer products grouped by owner */
.own{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
td.grp{vertical-align:top;border-right:1px solid var(--line2);background:#fcfcfc}
.subtotal{font-size:12px;color:var(--muted);margin-top:4px}
.route-inline{display:inline-flex;align-items:center;gap:8px}
.route-inline .arrow{color:var(--faint)}

/* history timeline */
.tl{list-style:none;margin:0;padding:14px 16px 6px}
.tl li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;position:relative;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:13.5px;top:26px;bottom:2px;width:1px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:var(--muted)}
.tl .ico svg{width:14px;height:14px}
.tl .ico.done{background:var(--greenbg);border-color:#d3f0dc;color:var(--green)}
.tl .ico.work{background:var(--bluebg);border-color:#dbe6fe;color:var(--blue)}
.tl .ico.cancel{background:var(--redbg);border-color:#fbdcdc;color:var(--red)}
.tl .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:4px}
.tl .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.tl .d s{color:var(--faint)}
.tl .w{font-size:12px;color:var(--muted);text-align:right;padding-top:5px;white-space:nowrap}
.tl .w b{display:block;font-weight:500;color:var(--fg2)}
.tl .future .ico{border-style:dashed;background:transparent}
.tl .future .t{color:var(--muted);font-weight:500}

/* change list inside a history entry */
.chg{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin-top:6px;font-size:12.5px}
.chg dt{color:var(--muted)}
.chg dd{margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--fg2)}
.chg s{color:var(--faint)}
.chg .to{color:var(--fg);font-weight:550}

/* stock page */
.toolbar{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.toolbar h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
.tb-row{display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;padding:3px;background:#f4f4f5;border-radius:9px;gap:2px}
.seg span{padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg span.on{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.search{flex:1;height:34px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--faint);font-size:13px}
.search svg{width:14px;height:14px}
.stock th.g{text-align:center;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:0;padding-bottom:0}
.stock th.g span{display:block;border-bottom:1px solid var(--line);padding-bottom:6px}
.stock .sep{border-left:1px solid var(--line2)}
.stock .tot{background:#fcfcfc}
.stock .c-free{background:#f7f7f8}
.stock .c-reg{background:#f4f7ff}
.stock .c-ord{background:#eef3fe}
.stock tbody tr:hover .c-free{background:#f1f1f3}
.stock tbody tr:hover .c-reg{background:#ecf1fe}
.stock tbody tr:hover .c-ord{background:#e5ecfd}
.stock th .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.stock td.n .u{color:var(--faint);font-weight:400;margin-left:3px;font-size:12px}
.mini{display:flex;gap:2px;height:4px;width:84px;border-radius:999px;overflow:hidden;background:#ececef;margin-left:auto;margin-top:5px}
.mini i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
</style>
</head>
<body>
<nav class="switcher" id="switcher"><b>Экран:</b></nav>
<div class="notes" id="notes"></div>
<section class="frame"><div class="app">
  <aside class="rail" aria-hidden="true"><div class="logo">Y</div><div class="ic"></div><div class="ic"></div><div class="ic"></div><div class="ic on"></div><div class="ic"></div><div style="flex:1"></div><div class="ic"></div></aside>
  <nav class="side" id="side" aria-label="Навигация магазина"></nav>
  <main class="main" id="main"></main>
</div></section>

<script>
/* ---------- icons ---------- */
const svg = (d, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  chev: svg('<path d="m9 6 6 6-6 6"/>', 2),
  down: svg('<path d="m6 9 6 6 6-6"/>', 2),
  check: svg('<path d="M20 6 9 17l-5-5"/>', 3),

/* ---------- atoms ---------- */
const code = (c) => `<a class="code" href="#">${c}</a>`;
const pill = (label, tone) => `<span class="pill ${tone}"><i></i>${label}</span>`;
const prod = (name, sku) => `<div class="prod"><a href="#">${name}</a>${code(sku)}</div>`;
const ent = (label, c) => c ? `<div class="ent"><span>${label}</span>${code(c)}</div>` : `<span class="strong">${label}</span>`;
const q = (v, u = '') => v ? `<span class="num">${v}${u ? ' ' + u : ''}</span>` : `<span class="zero">—</span>`;
const edit = (v) => `<span class="edit">${I.cal}${v}</span>`;
const sel = (v) => `<span class="sel">${v}${I.down}</span>`;
const moreBtn = (label) => `<button class="btn sm icon" aria-label="${label}">${I.more}</button>`;
const none = '<span class="zero">—</span>';

/* ---------- grouped sidebar ---------- */
const NAV = [
  { title: 'Каталог', items: [['products', 'Товары', I.box], ['pricelists', 'Прайс-листы', I.tag]] },
  { title: 'Продажи', items: [['co', 'Заказы клиента', I.cart], ['shp', 'Отгрузки и возвраты', I.truck], ['rsv', 'Резервы', I.lock]] },

  { title: 'Справочники', items: [['wh', 'Склады', I.home], ['reg', 'Регионы', I.map], ['plt', 'Заводы', I.factory]] },

const renderSide = (active) => `
  <div class="mod">Магазин</div>
  ${NAV.map((g) => `<div class="grp"><div class="grp-t">${g.title}</div>${g.items.map(([id, l, ic]) => `<a href="#" class="${id === active ? 'on' : ''}" ${id === active ? 'aria-current="page"' : ''}>${ic}${l}</a>`).join('')}</div>`).join('')}

/* ---------- document shell ---------- */
const crumbs = (list, current) => `<nav class="crumbs">Магазин <i>›</i> Логистика <i>›</i> ${list} <i>›</i> <b>${current}</b></nav>`;

const docHead = ({ kind, icon, number, status, desc, actions, meta }) => `
<header class="card dh">
  <div class="dh-top">
    <div>
      <div class="eyebrow">${icon}${kind}</div>
      <div class="dh-title"><h1>${number}</h1>${status}</div>
      ${desc ? `<p class="dh-desc">${desc}</p>` : ''}
    </div>
    <div class="dh-actions">${actions}</div>
  </div>
  <dl class="meta">${meta.map(([dt, dd, cls]) => `<div class="${cls || ''}"><dt>${dt}</dt><dd>${dd}</dd></div>`).join('')}</dl>
</header>`;

/* tabs: one section visible at a time, hash keeps the tab */
const tabs = (sections) => `
<div class="tabs" role="tablist" aria-label="Разделы документа">
  ${sections.map((s, i) => `<button role="tab" id="tab-${s.id}" aria-controls="panel-${s.id}" aria-selected="${i === 0}" onclick="selectTab('${s.id}')">${s.label}${s.count != null ? `<span class="tc">${s.count}</span>` : ''}</button>`).join('')}
</div>
${sections.map((s, i) => `<div class="panel" role="tabpanel" id="panel-${s.id}" aria-labelledby="tab-${s.id}" ${i === 0 ? '' : 'hidden'}>${s.html}</div>`).join('')}`;
window.selectTab = (id) => {
  document.querySelectorAll('.tabs [role=tab]').forEach((t) => t.setAttribute('aria-selected', String(t.id === `tab-${id}`)));
  document.querySelectorAll('[role=tabpanel]').forEach((p) => { p.hidden = p.id !== `panel-${id}`; });
};

const section = ({ title, count, tools = '', body, foot = '' }) => `
<section class="card sec">
  <h2 class="sr-only">${title}</h2>
  ${tools ? `<div class="sec-h"><div class="tools">${tools}</div></div>` : ''}
  ${body}
  ${foot ? `<div class="sec-f">${foot}</div>` : ''}
</section>`;

const simpleTable = (cols, rows) => `<div class="tw"><table>
  <thead><tr>${cols.map((c) => `<th class="${c[1] || ''}">${c[0]}</th>`).join('')}</tr></thead>
  <tbody>${rows.map((r) => `<tr>${r.map((cell, j) => `<td class="${cols[j][1] || ''}">${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

/* ---------- movements ---------- */
const movements = (rows, { hideDoc = false, total, pages } = {}) => section({
  title: 'Движения', count: total ?? rows.length,
  body: `<div class="tw"><table>
    <thead><tr><th>Время</th><th class="n">Изменение</th><th>Товар</th><th>Место</th><th>Закреплено за</th>${hideDoc ? '' : '<th>Документ</th>'}</tr></thead>
    <tbody>${rows.map((r) => `<tr>
      <td class="time">${r[0]}</td>
      <td class="n"><span class="delta ${r[1].startsWith('+') ? 'plus' : 'minus'}">${r[1]}</span></td>
      <td>${prod(r[2], r[3])}</td>
      <td>${ent(r[4], r[5])}</td>
      <td>${ent(r[6], r[7])}</td>
      ${hideDoc ? '' : `<td>${ent(r[8], r[9])}</td>`}
    </tr>`).join('')}</tbody></table></div>`,
  foot: `<span>Показано ${rows.length} из ${total ?? rows.length}</span>${pages ? `<div class="pager"><span>‹</span><span class="on">1</span><span>2</span><span>3</span><span>›</span></div>` : ''}`,
});

/* ---------- universal history ----------
   One entry = one history snapshot. Every field that differs from the previous
   snapshot becomes one change line, so a simultaneous status + date change is ONE entry. */
const TL_ICON = { create: I.file, work: I.play, done: I.check, cancel: I.x, date: I.cal, post: I.check, edit: I.edit, future: I.check };
const TL_TONE = { done: 'done', post: 'done', work: 'work', cancel: 'cancel' };
const change = ([label, from, to]) => `<dt>${label}</dt><dd>${from != null ? `<s>${from}</s> → ` : ''}<span class="to">${to}</span></dd>`;
const historySection = (events) => section({
  title: 'История', count: events.filter((e) => e.kind !== 'future').length,
  body: `<ol class="tl">${events.map((e) => `<li class="${e.kind === 'future' ? 'future' : ''}">
    <span class="ico ${TL_TONE[e.kind] || ''}">${TL_ICON[e.kind]}</span>
    <div><div class="t">${e.title}</div>${e.changes ? `<dl class="chg">${e.changes.map(change).join('')}</dl>` : ''}${e.detail ? `<div class="d">${e.detail}</div>` : ''}</div>
    <div class="w">${e.at ? `<b>${e.at}</b>${e.by || ''}` : ''}</div>
  </li>`).join('')}</ol>`,
});

const sw = document.getElementById('switcher');
ORDER.forEach((k) => { const b = document.createElement('button'); b.textContent = S[k].label; b.dataset.k = k; b.onclick = () => { location.hash = k; }; sw.appendChild(b); });
function show(k) {
  const s = S[k];
  document.getElementById('side').innerHTML = renderSide(s.nav);
  document.getElementById('main').innerHTML = s.render();
  document.getElementById('notes').innerHTML = `<h3>${s.label}: что изменилось</h3><ul>${s.notes.map((n) => `<li>${n}</li>`).join('')}</ul>`;
  [...sw.querySelectorAll('button')].forEach((b) => b.classList.toggle('on', b.dataset.k === k));
}
const fromHash = () => { const [k, tab] = location.hash.slice(1).split(':'); show(ORDER.includes(k) ? k : 'co'); if (tab) selectTab(tab); };
window.addEventListener('hashchange', fromHash);
fromHash();
