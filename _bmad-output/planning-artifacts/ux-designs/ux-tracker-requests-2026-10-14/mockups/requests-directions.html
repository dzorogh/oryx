<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oryx · Tracker · Заявки — варианты визуала</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#f5f5f6;--card:#fff;--fg:#18181b;--fg2:#3f3f46;--muted:#71717a;--faint:#a1a1aa;
  --line:#e6e6e9;--line2:#f0f0f2;--soft:#f8f8f9;--primary:#18181b;--nav:#141b33;--lime:#c9f56a;
  --blue:#2563eb;--bluebg:#eff4ff;--green:#15803d;--greenbg:#effaf2;--amber:#b45309;--amberbg:#fff7ea;
  --red:#b91c1c;--redbg:#fef2f2;--violet:#6d28d9;--violetbg:#f5f0ff;--slate:#475569;--slatebg:#f1f5f9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9eaee;color:var(--fg);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
svg.lucide{width:16px;height:16px;stroke-width:1.9;flex:none}

.switcher{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 20px;background:rgb(233 234 238 / .9);backdrop-filter:blur(8px);border-bottom:1px solid #dcdde2}
.sw{display:flex;gap:4px;align-items:center}
.sw b{font-size:12px;color:var(--muted);font-weight:600;margin-right:4px}
.sw button{border:1px solid #d6d7dc;background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--fg2)}
.sw button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.notes{width:min(1440px,calc(100vw - 40px));margin:14px auto 0;background:#fff;border:1px solid #dcdde2;border-radius:12px;padding:12px 16px;font-size:13px;color:var(--fg2)}
.notes h3{margin:0 0 6px;font-size:13px}.notes ul{margin:0;padding-left:18px}.notes li{margin:2px 0}

.frame{width:min(1440px,calc(100vw - 40px));margin:14px auto 40px;border:1px solid #d7d9df;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgb(17 24 39 / .08);background:var(--bg);position:relative}
.app{display:grid;grid-template-columns:48px 220px minmax(0,1fr);min-height:900px}
.rail{background:var(--nav);display:flex;flex-direction:column;align-items:center;gap:18px;padding:12px 0;color:#8b93b0}
.rail .logo{width:26px;height:26px;border-radius:7px;background:var(--lime);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--nav)}
.rail .on{color:#fff}
.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:12px}
.side .mod{padding:0 8px;font-weight:650}
.side .grp-t{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:0 9px 4px}
.side a{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;font-size:12.5px;color:#52525b}
.side a:hover{background:var(--soft)}
.side a.on{background:#f1f1f3;color:var(--fg);font-weight:600}
.side a .cnt{margin-left:auto;font-size:11px;background:var(--amberbg);color:var(--amber);border-radius:999px;padding:0 6px;font-weight:600}
.side a svg.lucide{width:14px;height:14px}
.side hr{border:0;border-top:1px solid var(--line);margin:0}

.main{min-width:0;padding:14px 18px 36px;display:flex;flex-direction:column;gap:14px}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs a:hover{color:var(--fg)}
.crumbs b{color:var(--fg);font-weight:600}
.card{background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.tb{padding:12px}
.tb-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tb h1{margin:0;font-size:18px;font-weight:600}
.tb-sep{border-top:1px solid var(--line);margin:10px -12px}
.tb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:#27272a}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.inp,.sel,.ta{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;font-size:13px;width:100%}
.ta{height:auto;min-height:84px;padding:8px 10px;resize:vertical}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid #c7d2fe;border-color:#a5b4fc}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:32px}
.search.big .inp{height:46px;font-size:15px;border-radius:12px;padding-left:40px}
.search.big svg{left:14px;width:18px;height:18px}
.grow{flex:1}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--soft);color:var(--fg2);border:1px solid var(--line2);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}

/* section colors */
.c-blue{--c:#2563eb;--cb:#eff4ff}.c-violet{--c:#7c3aed;--cb:#f5f0ff}.c-green{--c:#15803d;--cb:#effaf2}
.c-amber{--c:#c2410c;--cb:#fff4ea}.c-slate{--c:#334155;--cb:#f1f5f9}.c-cyan{--c:#0e7490;--cb:#ecfeff}.c-pink{--c:#be185d;--cb:#fdf2f8}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--cb);color:var(--c);flex:none}
.ico.sm{width:28px;height:28px;border-radius:8px}
.ico.sm svg.lucide{width:15px;height:15px}
.ico.lg{width:44px;height:44px;border-radius:12px}
.ico.lg svg.lucide{width:22px;height:22px}

/* V1 tiles */
.hero{padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.hero h1{margin:0;font-size:20px;font-weight:650}
.hero p{margin:0;color:var(--muted);font-size:13px}
.pop{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pop a{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--fg2)}
.pop a:hover{background:#fff;border-color:#d4d4d8}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.tile:hover{box-shadow:0 0 0 1px #d4d4d8,0 8px 24px rgb(0 0 0 / .06);transform:translateY(-1px)}
.tile-h{display:flex;gap:12px;align-items:center}
.tile-h b{font-size:15px}
.tile-h .muted{font-size:12px}
.tile p{margin:0;font-size:12.5px;color:var(--muted)}
.tile .subs{display:flex;flex-wrap:wrap;gap:4px}
.sec-title{display:flex;align-items:baseline;gap:8px;margin:4px 2px -4px}
.sec-title h2{margin:0;font-size:14px;font-weight:600}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.type{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:box-shadow .15s}
.type:hover{box-shadow:0 0 0 1px #c4c4ca,0 6px 18px rgb(0 0 0 / .05)}
.type b{font-size:13.5px;font-weight:600;display:block}
.type .muted{font-size:12px;display:block;margin-top:2px}
.type .meta{display:flex;gap:6px;margin-top:8px}
.anchors{display:flex;gap:6px;flex-wrap:wrap}
.anchors a{font-size:12.5px;padding:5px 10px;border-radius:8px;color:var(--fg2)}
.anchors a:hover{background:var(--soft)}
.anchors a.on{background:#f1f1f3;font-weight:600;color:var(--fg)}

/* V2 tabs + columns */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 -12px -12px;padding:0 8px}
.tabs a{display:flex;align-items:center;gap:6px;padding:10px 10px 9px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--fg)}
.tabs a.on{color:var(--fg);font-weight:600;border-color:var(--fg)}
.tabs a svg.lucide{width:15px;height:15px}
.cols{columns:3 320px;column-gap:12px}
.col{break-inside:avoid;margin-bottom:12px;padding:6px}
.col-h{display:flex;align-items:center;gap:10px;padding:8px 8px 10px}
.col-h b{font-size:14px}
.col-h .muted{font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.row:hover{background:var(--soft)}
.row .t{font-size:13px;font-weight:500}
.row .d{font-size:12px;color:var(--muted)}
.row .chev{margin-left:auto;color:var(--faint)}
.row:hover .chev{color:var(--fg)}

/* V3 tree split */
.split3{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.tree{padding:8px;position:sticky;top:60px}
.tree .sec{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.tree .sec:hover{background:var(--soft)}
.tree .sec .chev{margin-left:auto;color:var(--faint)}
.tree .sub{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 44px;border-radius:8px;font-size:12.5px;color:var(--fg2);cursor:pointer}
.tree .sub:hover{background:var(--soft)}
.tree .sub.on{background:#f1f1f3;color:var(--fg);font-weight:600}
.tree .sub span.n{font-size:11px;color:var(--faint)}
.v3-head{padding:16px;display:flex;gap:14px;align-items:center}
.v3-head h2{margin:0;font-size:17px}
.v3-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.bigtypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.bigtype{padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:130px}
.bigtype:hover{box-shadow:0 0 0 1px #c4c4ca,0 8px 22px rgb(0 0 0 / .06)}
.bigtype b{font-size:14px}
.bigtype p{margin:0;font-size:12.5px;color:var(--muted);flex:1}
.bigtype .meta{display:flex;gap:6px;flex-wrap:wrap}

/* Form */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.form-card{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.form-head{display:flex;gap:14px;align-items:flex-start}
.form-head h1{margin:0;font-size:19px;font-weight:650}
.form-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--fg2)}
.f label i{color:var(--red);font-style:normal;margin-left:2px}
.f .hint{font-size:11.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content}
.seg button{height:32px;padding:0 12px;border:0;border-left:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:#f1f1f3;font-weight:600}
.drop{border:1.5px dashed #d4d4d8;border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--soft)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.chk input{width:15px;height:15px;accent-color:#18181b}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:500;cursor:pointer}
.chips input{accent-color:#18181b}
.person{display:flex;align-items:center;gap:8px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:13px}
.person img{width:22px;height:22px;border-radius:50%}
.radios{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:12.5px}
.rcard b{display:block;font-size:13px;margin-bottom:2px}
.rcard.on{border-color:#18181b;box-shadow:0 0 0 1px #18181b}
.form-foot{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.aside-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.aside-card h3{margin:0;font-size:13px;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;font-size:12.5px;position:relative;padding-bottom:12px}
.steps li:not(:last-child)::before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:1px;background:var(--line)}
.steps .n{width:19px;height:19px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.steps b{display:block;font-weight:600}

/* My requests */
.mine{display:grid;grid-template-columns:400px minmax(0,1fr);gap:14px;align-items:start}
.list{padding:6px;display:flex;flex-direction:column;gap:2px;max-height:calc(900px - 150px);overflow:auto}
.li{display:flex;flex-direction:column;gap:6px;padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.li:hover{background:var(--soft)}
.li.on{background:#f4f4f6;border-color:var(--line)}
.li-top{display:flex;align-items:center;gap:8px}
.li-top .num{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.li-top .time{margin-left:auto;font-size:11.5px;color:var(--faint)}
.li .ttl{font-size:13.5px;font-weight:600;line-height:1.3}
.li .path{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.li .last{font-size:12px;color:var(--fg2);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .last svg.lucide{width:13px;height:13px;color:var(--faint)}
.li .unread{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.new{background:var(--slatebg);color:var(--slate)}
.st.progress{background:var(--bluebg);color:var(--blue)}
.st.waiting{background:var(--amberbg);color:var(--amber)}
.st.approval{background:var(--violetbg);color:var(--violet)}
.st.done{background:var(--greenbg);color:var(--green)}
.st.rejected{background:var(--redbg);color:var(--red)}
.detail{display:flex;flex-direction:column}
.d-head{padding:18px 20px 14px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0;font-size:18px;font-weight:650;line-height:1.3}
.d-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
.d-meta span{display:flex;align-items:center;gap:6px}
.d-meta b{color:var(--fg);font-weight:500}
.d-meta img{width:20px;height:20px;border-radius:50%}
.track{display:flex;gap:0;align-items:center}
.track .s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.track .s .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid #d4d4d8;display:grid;place-items:center;background:#fff}
.track .s .dot svg.lucide{width:11px;height:11px}
.track .s.done{color:var(--fg2)}
.track .s.done .dot{background:var(--fg);border-color:var(--fg);color:#fff}
.track .s.cur{color:var(--fg);font-weight:600}
.track .s.cur .dot{border-color:var(--blue);box-shadow:0 0 0 3px var(--bluebg)}
.track .s.cur .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
.track .s.bad .dot{background:var(--red);border-color:var(--red);color:#fff}
.track .ln{flex:1;height:1.5px;background:#e4e4e7;margin:0 10px;min-width:20px}
.track .ln.done{background:var(--fg)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13px}
.banner.amber{background:var(--amberbg);color:#7c2d12;border:1px solid #fde4c4}
.banner.red{background:var(--redbg);color:#7f1d1d;border:1px solid #fecaca}
.banner.green{background:var(--greenbg);color:#14532d;border:1px solid #c9ecd4}
.d-body{display:grid;grid-template-columns:minmax(0,1fr) 300px}
.thread{padding:16px 20px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line)}
.thread h3,.data h3{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.msg{display:flex;gap:10px}
.msg img{width:30px;height:30px;border-radius:50%;flex:none}
.msg .bub{background:var(--soft);border:1px solid var(--line2);border-radius:4px 12px 12px 12px;padding:9px 12px;font-size:13px;max-width:560px}
.msg .who{font-size:12px;margin-bottom:3px;display:flex;gap:8px;align-items:baseline}
.msg .who b{font-weight:600}
.msg .who span{color:var(--faint);font-size:11.5px}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:#eef2ff;border-color:#e0e7ff;border-radius:12px 4px 12px 12px}
.msg.me .who{justify-content:flex-end}
.sys{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:center}
.sys::before,.sys::after{content:"";flex:1;height:1px;background:var(--line2)}
.reply{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.reply textarea{border:0;resize:none;min-height:54px;outline:none;font-size:13px;padding:4px 6px}
.reply .bar{display:flex;gap:6px;align-items:center}
.data{padding:16px;display:flex;flex-direction:column;gap:12px;background:#fcfcfd}
.dv{display:flex;flex-direction:column;gap:2px;font-size:13px}
.dv span{font-size:11.5px;color:var(--muted)}
.dv .file{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff;font-size:12.5px;width:fit-content}
.empty{padding:60px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:#18181b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:flex;gap:8px;align-items:center;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="switcher">
  <div class="sw"><b>Витрина</b>
    <button data-v="1">Вариант 1 · Плитки разделов</button>
    <button data-v="2">Вариант 2 · Вкладки и колонки</button>
    <button data-v="3">Вариант 3 · Дерево и карточки</button>
  </div>
  <div class="sw"><b>Экран</b>
    <button data-s="catalog">Каталог</button>
    <button data-s="form">Форма</button>
    <button data-s="mine">Мои заявки</button>
  </div>
</div>

<div class="notes" id="notes"></div>

<div class="frame">
  <div class="app">
    <nav class="rail">
      <div class="logo">O</div>
      <i data-lucide="layout-grid"></i>
      <i data-lucide="check-square" class="on"></i>
      <i data-lucide="package"></i>
      <i data-lucide="truck"></i>
      <i data-lucide="message-circle"></i>
    </nav>
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>
</div>

/* ---------- Form ---------- */
function fieldHtml(f,i){
 const lab = `<label>${f.l}${f.req?'<i>*</i>':''}</label>`;
 const hint = f.hint?`<span class="hint">${f.hint}</span>`:'';
 let ctl='';
 switch(f.k){
  case 'text': ctl=`<input class="inp" placeholder="${f.ph||''}">`;break;
  case 'area': ctl=`<textarea class="ta" placeholder="${f.ph||''}"></textarea>`;break;
  case 'sel': ctl=`<select class="sel"><option value="">Выберите…</option>${f.opts.map(o=>`<option>${o}</option>`).join('')}</select>`;break;
  case 'date': ctl=`<input class="inp" type="date">`;break;
  case 'range': ctl=`<div style="display:flex;gap:8px;align-items:center"><input class="inp" type="date"><span class="muted">—</span><input class="inp" type="date"></div>`;break;
  case 'money': ctl=`<div style="position:relative"><input class="inp" placeholder="0" style="padding-right:28px"><span class="muted" style="position:absolute;right:10px;top:7px">₽</span></div>`;break;
  case 'num': ctl=`<input class="inp" type="number" value="${f.v||''}">`;break;
  case 'person': ctl=`<div class="person"><img src="${AV(f.v||'me')}" alt="">${f.v||'Выберите сотрудника'}<span class="grow"></span>${icon('chevrons-up-down')}</div>`;break;
  case 'seg': ctl=`<div class="seg" data-seg>${f.opts.map((o,j)=>`<button type="button" class="${j===(f.on||0)?'on':''}">${o}</button>`).join('')}</div>`;break;
  case 'chk': return `<div class="f ${f.full?'full':''}"><label class="chk"><input type="checkbox">${f.l}${f.req?'<i style="color:var(--red);font-style:normal">*</i>':''}</label></div>`;
  case 'chips': ctl=`<div class="chips">${f.opts.map((o,j)=>`<label><input type="checkbox" ${j===0?'checked':''}>${o}</label>`).join('')}</div>`;break;
  case 'cards': ctl=`<div class="radios" data-cards>${f.opts.map(([a,b],j)=>`<div class="rcard ${j===(f.on||0)?'on':''}"><b>${a}</b><span class="muted">${b}</span></div>`).join('')}</div>`;break;
  case 'file': ctl=`<div class="drop">${icon('upload-cloud')}<span>Перетащите файлы или <b style="color:var(--fg)">выберите</b></span><span class="small">До 20 МБ: PNG, JPG, PDF, DOCX, XLSX</span></div>`;break;
 }
 return `<div class="f ${f.full?'full':''}">${lab}${ctl}${hint}</div>`;
}

function track(r){
 const steps=['Создана','Принята','В работе','Решена'];
 const idx={new:0,approval:1,waiting:2,progress:2,done:3,rejected:1}[r.status];
 return `<div class="track">${steps.map((s,i)=>{
  const bad = r.status==='rejected'&&i===1;
  const label = bad?'Отклонена':(r.status==='approval'&&i===1?'Согласование':(r.status==='waiting'&&i===2?'Ждёт вас':s));
  const cls = bad?'bad':(i<idx||r.status==='done'&&i===idx?'done':(i===idx?'cur':''));
  if(r.status==='rejected'&&i>1) return '';
  return (i?`<span class="ln ${i<=idx?'done':''}"></span>`:'')+`<span class="s ${cls}"><span class="dot">${cls==='done'?icon('check'):bad?icon('x'):''}</span>${label}</span>`;
 }).join('')}</div>`;
}
function mineScreen(){
 const counts = s => REQUESTS.filter(r=>s==='all'||(s==='active'?!['done','rejected'].includes(r.status):r.status===s)).length;
 const filters=[['all','Все'],['active','Активные'],['waiting','Ждут меня'],['done','Решённые'],['rejected','Отклонённые']];
 const list = REQUESTS.filter(r=>st.filter==='all'||(st.filter==='active'?!['done','rejected'].includes(r.status):r.status===st.filter));
 const r = REQUESTS.find(x=>x.num===st.req)||list[0];
 const ft = r && findType(r.type);
 return `
 <div class="crumbs"><span>Tracker</span>›<a onclick="go({screen:'catalog',sec:null})">Заявки</a>›<b>Мои заявки</b></div>
 <div class="card tb">
  <div class="tb-top"><h1>Мои заявки</h1>
   <div class="tb-row"><div class="search" style="width:300px">${icon('search')}<input class="inp" placeholder="Номер, тема или текст"></div>
   <a class="btn pri" onclick="go({screen:'catalog',sec:null})">${icon('plus')}Новая заявка</a></div></div>
  <div style="height:10px"></div>
  <div class="tabs">${filters.map(([k,l])=>`<a class="${st.filter===k?'on':''}" onclick="go({filter:'${k}'})">${l}<span class="muted small">${counts(k)}</span></a>`).join('')}</div>
 </div>
 <div class="mine">
  <div class="card list">
   ${list.map(x=>{const f=findType(x.type);const last=[...x.thread].reverse().find(m=>m.m);return `
   <div class="li ${r&&x.num===r.num?'on':''}" onclick="go({req:'${x.num}'})">
    <div class="li-top"><span class="st ${x.status}">${STATUS[x.status]}</span><span class="num">${x.num}</span>${x.unread?'<span class="unread" title="Новый комментарий"></span>':''}<span class="time">${x.updated}</span></div>
    <div class="ttl">${x.title}</div>
    <div class="path"><span class="ico sm c-${f.sec.color}" style="width:18px;height:18px;border-radius:5px">${icon(f.sec.icon)}</span>${f.sec.name} · ${f.sub.name} · ${f.type.name}</div>
    ${last?`<div class="last">${icon('message-square')}<span style="overflow:hidden;text-overflow:ellipsis">${last.me?'Вы':last.who.split(' ')[0]}: ${last.m}</span></div>`:''}
   </div>`}).join('')||'<div class="empty">Нет заявок</div>'}
  </div>
  ${r?`<div class="card detail">
   <div class="d-head">
    <div style="display:flex;gap:10px;align-items:center"><span class="st ${r.status}">${STATUS[r.status]}</span><span class="muted small">${r.num}</span><span class="grow"></span>
     <button class="btn ghost">${icon('copy')}Повторить</button>${!['done','rejected'].includes(r.status)?`<button class="btn ghost">${icon('x-circle')}Отозвать</button>`:''}</div>
    <h2>${r.title}</h2>
    <div class="d-meta">
     <span>${icon('folder')}<b>${ft.sec.name} › ${ft.sub.name} › ${ft.type.name}</b></span>
     <span><img src="${AV(r.exec)}" alt="">Исполнитель: <b>${r.exec}</b></span>
     <span>${icon('calendar')}Создана: <b>${r.created}</b></span>
     <span>${icon('clock')}Срок: <b>${r.due}</b></span>
    </div>
    ${track(r)}
    ${r.wait?`<div class="banner amber">${icon('message-circle-warning')}<div><b>Исполнитель ждёт вашего ответа.</b> ${r.wait}</div></div>`:''}
    ${r.reject?`<div class="banner red">${icon('ban')}<div><b>Заявка отклонена.</b> ${r.reject}</div></div>`:''}
    ${r.status==='done'?`<div class="banner green">${icon('check-circle-2')}<div><b>Заявка решена.</b> Если что-то не так — напишите в комментарии, заявка вернётся в работу.</div></div>`:''}
   </div>
   <div class="d-body">
    <div class="thread">
     <h3>${icon('messages-square')}Обсуждение</h3>
     ${r.thread.map(m=>m.sys?`<div class="sys">${m.sys}</div>`:`
      <div class="msg ${m.me?'me':''}"><img src="${AV(m.me?'me':m.who)}" alt=""><div><div class="who"><b>${m.me?'Вы':m.who}</b><span>${m.t}</span></div><div class="bub">${m.m}</div></div></div>`).join('')}
     <div class="reply"><textarea placeholder="${r.wait?'Ответьте исполнителю…':'Написать комментарий…'}"></textarea>
      <div class="bar"><button class="btn ghost">${icon('paperclip')}Файл</button><span class="grow"></span><button class="btn pri" onclick="toast('Комментарий отправлен (демо)')">${icon('send')}Отправить</button></div></div>
    </div>
    <div class="data">
     <h3>${icon('file-text')}Данные заявки</h3>
     ${r.data.map(([k,v])=>`<div class="dv"><span>${k}</span>${/\.(png|pdf|jpg)$/.test(v)?`<span class="file">${icon('paperclip')}${v}</span>`:`<div style="white-space:pre-line">${v}</div>`}</div>`).join('')}
    </div>
   </div>
  </div>`:'<div class="card empty">Выберите заявку</div>'}
 </div>`;
}

/* ---------- Main render ---------- */
function render(){
 document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',+b.dataset.v===st.v));
 document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===(st.screen==='section'?'catalog':st.screen)));
 const n = st.screen==='form'?['<b>Форма заявки</b> — общая для всех вариантов. Набор полей свой у каждого вида: попробуйте «Баг», «Оплата счёта», «Ноутбук», «Ежегодный отпуск», «Гостевой пропуск».','Справа — «Что будет дальше»: исполнитель, срок, этапы. «Отправить» создаёт заявку только в этой вкладке и открывает «Мои заявки».']
  : st.screen==='mine'?['<b>Мои заявки</b> — общий экран: слева список с фильтрами и последним комментарием, справа карточка со статусом, обсуждением и данными, которые вы заполнили.','Попробуйте ЗВ-2475 (ждёт вашего ответа), ЗВ-2431 (отклонена), ЗВ-2462 (решена).']
  : NOTES[st.v];
 $('#notes').innerHTML = `<h3>Что смотреть</h3><ul>${n.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 renderSide();
 let html='';
 if(st.screen==='form') html=formScreen();
 else if(st.screen==='mine') html=mineScreen();
 else if(st.screen==='section'&&st.v===1&&st.sec) html=v1Section();
 else html = st.v===1?v1Catalog():st.v===2?v2Catalog():v3Catalog();
 $('#main').innerHTML = html;
 lucide.createIcons();
}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;go({v,screen:st.screen==='section'?'catalog':st.screen,sec:null})});
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>go({screen:b.dataset.s,sec:null}));
document.addEventListener('click',e=>{
 const sb=e.target.closest('[data-seg] button');if(sb){sb.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));sb.classList.add('on')}
 const rc=e.target.closest('[data-cards] .rcard');if(rc){rc.parentElement.querySelectorAll('.rcard').forEach(x=>x.classList.remove('on'));rc.classList.add('on')}
});
render();
</script>
</body>
</html>
